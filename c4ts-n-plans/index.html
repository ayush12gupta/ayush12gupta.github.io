<style>
  .together-wrap {
    display: flex;
    gap: 2rem;
    align-items: flex-start;
    flex-wrap: wrap;
    margin-top: 1rem;
  }
  .tracker-card, .cats-card {
    background: linear-gradient(135deg, #fff0f6 0%, #f3e8ff 100%);
    border-radius: 1.2rem;
    padding: 1.6rem;
    box-shadow: 0 4px 18px rgba(200, 100, 200, 0.12);
    flex: 1 1 300px;
  }
  .card-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: #9b59b6;
    margin-bottom: 1rem;
  }
  .add-row {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .add-row input {
    flex: 1;
    border: 2px solid #d8aaff;
    border-radius: 0.7rem;
    padding: 0.45rem 0.8rem;
    font-size: 0.95rem;
    outline: none;
    background: #fff;
    color: #333;
    transition: border-color 0.2s;
  }
  .add-row input:focus { border-color: #9b59b6; }
  .add-row button, .cat-btn {
    background: linear-gradient(135deg, #c471ed, #9b59b6);
    color: #fff;
    border: none;
    border-radius: 0.7rem;
    padding: 0.45rem 1rem;
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 600;
    transition: opacity 0.2s;
  }
  .add-row button:hover, .cat-btn:hover { opacity: 0.85; }
  #activity-list { list-style: none; padding: 0; margin: 0; }
  #activity-list li {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 0.3rem;
    border-bottom: 1px dashed #e0c8f8;
    font-size: 0.97rem;
    color: #333 !important;
  }
  #activity-list li:last-child { border-bottom: none; }
  #activity-list li input[type="checkbox"] {
    accent-color: #9b59b6;
    width: 1.1rem;
    height: 1.1rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  #activity-list li span { flex: 1; }
  #activity-list li.done span {
    text-decoration: line-through;
    color: #999 !important;
  }
  .del-btn {
    background: none;
    border: none;
    color: #d9a0e0;
    font-size: 1rem;
    cursor: pointer;
    padding: 0 0.2rem;
    line-height: 1;
    transition: color 0.2s;
  }
  .del-btn:hover { color: #9b59b6; }
  .empty-msg {
    color: #c8a0dc !important;
    font-size: 0.9rem;
    font-style: italic;
    text-align: center;
    padding: 1rem 0;
  }
  .gif-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.7rem;
    margin-bottom: 1rem;
  }
  .gif-grid img {
    width: 100%;
    border-radius: 0.8rem;
    object-fit: cover;
    aspect-ratio: 1;
    display: block;
  }
  .random-cat-wrap { text-align: center; margin-top: 0.8rem; }
  #random-cat { width: 100%; border-radius: 0.8rem; margin-bottom: 0.8rem; display: none; }
  .cat-btn { width: 100%; padding: 0.6rem; font-size: 1rem; }
  @media (max-width: 600px) { .together-wrap { flex-direction: column; } }
</style>

<div class="together-wrap">
  <div class="tracker-card">
    <div class="card-title">✨ things we wanna do</div>
    <div class="add-row">
      <input type="text" id="activity-input" placeholder="add something fun..." maxlength="120" />
      <button onclick="addActivity()">add</button>
    </div>
    <ul id="activity-list"></ul>
    <p class="empty-msg" id="empty-msg">no plans yet — add something! 🌸</p>
  </div>
  <div class="cats-card">
    <div class="card-title">🐱 find Chloe</div>
    <div class="gif-grid" id="gif-grid"></div>
    <div class="random-cat-wrap">
      <button class="cat-btn" onclick="shuffleGifs()">shuffle cats 🐾</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCihVHgSKRVcR-_RAbnm-pa4J4WXZOAvdc",
    authDomain: "katelyn-e4521.firebaseapp.com",
    databaseURL: "https://katelyn-e4521-default-rtdb.firebaseio.com",
    projectId: "katelyn-e4521",
    storageBucket: "katelyn-e4521.firebasestorage.app",
    messagingSenderId: "624664107803",
    appId: "1:624664107803:web:603aae0dd561fed69811be"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const activitiesRef = ref(db, 'activities');

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  onValue(activitiesRef, function(snapshot) {
    const ul = document.getElementById('activity-list');
    const empty = document.getElementById('empty-msg');
    ul.innerHTML = '';
    const data = snapshot.val();
    if (!data) { empty.style.display = 'block'; return; }
    empty.style.display = 'none';
    Object.entries(data)
      .sort(function(a, b) { return (a[1].createdAt || 0) - (b[1].createdAt || 0); })
      .forEach(function([key, item]) {
        const li = document.createElement('li');
        if (item.done) li.classList.add('done');
        li.innerHTML =
          '<input type="checkbox"' + (item.done ? ' checked' : '') + ' />' +
          '<span style="color:' + (item.done ? '#999' : '#333') + '">' + escHtml(item.text) + '</span>' +
          '<button class="del-btn" title="delete">✕</button>';
        li.querySelector('input').addEventListener('change', function() {
          update(ref(db, 'activities/' + key), { done: !item.done });
        });
        li.querySelector('.del-btn').addEventListener('click', function() {
          remove(ref(db, 'activities/' + key));
        });
        ul.appendChild(li);
      });
  });

  window.addActivity = function() {
    const input = document.getElementById('activity-input');
    const text = input.value.trim();
    if (!text) return;
    push(activitiesRef, { text: text, done: false, createdAt: Date.now() });
    input.value = '';
  };

  const GIFS = [
    '/c4ts-n-plans/gif/cat_dance.gif',
    '/c4ts-n-plans/gif/cat_paw.gif',
    'https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif',
    'https://media.giphy.com/media/mlvseq9yvZhba/giphy.gif',
    'https://media.giphy.com/media/vFKqnCdLPNOKc/giphy.gif',
    'https://media.giphy.com/media/8vQSQ3cNXuDGo/giphy.gif',
    'https://media.giphy.com/media/GeimqsH0TLDt4tScGw/giphy.gif',
    'https://media.giphy.com/media/BzyTuYCmvSORqs1ABM/giphy.gif',
  ];

  window.shuffleGifs = function() {
    const shuffled = GIFS.slice().sort(function() { return Math.random() - 0.5; });
    const grid = document.getElementById('gif-grid');
    grid.innerHTML = shuffled.slice(0, 6).map(function(src) {
      return '<img src="' + src + '" alt="cat" loading="lazy" />';
    }).join('');
  };

  window.shuffleGifs();

  document.getElementById('activity-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') window.addActivity();
  });
</script>
