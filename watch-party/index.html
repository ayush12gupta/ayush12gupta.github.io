<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>watch party | Ayush Gupta</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg-grad: linear-gradient(135deg, #14121c 0%, #1c1428 100%);
    --card-bg: #1c1c26;
    --text: #eee;
    --accent: #c471ed;
    --accent-strong: #c98bf0;
    --border: #3a2a4a;
    --input-bg: #22222e;
    --shadow: rgba(0, 0, 0, 0.4);
    --muted: #999;
  }
  :root[data-theme="light"] {
    --bg-grad: linear-gradient(135deg, #fff0f6 0%, #f3e8ff 100%);
    --card-bg: #fff;
    --text: #333;
    --accent: #9b59b6;
    --accent-strong: #9b59b6;
    --border: #d8aaff;
    --input-bg: #fff;
    --shadow: rgba(200, 100, 200, 0.12);
    --muted: #999;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-grad);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header a { color: var(--accent-strong); text-decoration: none; font-weight: 600; }
  .header-right { display: flex; align-items: center; gap: 0.6rem; }
  #themeBtn {
    background: none;
    color: var(--text);
    border: 2px solid var(--border);
  }
  #avatarBtn {
    background: var(--input-bg);
    border: 2px solid var(--border);
    border-radius: 50%;
    width: 2.2rem;
    height: 2.2rem;
    padding: 0;
    font-size: 1.2rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 { margin: 0.2rem 0 0.8rem; color: var(--accent-strong); font-size: 1.5rem; }
  .wrap { padding: 0 1.5rem; }
  .main-col { max-width: 900px; }
  .card {
    background: var(--card-bg);
    border-radius: 1rem;
    box-shadow: 0 4px 18px var(--shadow);
    padding: 1rem;
    margin-bottom: 1rem;
  }
  input[type=text] {
    border: 2px solid var(--border);
    border-radius: 0.7rem;
    padding: 0.5rem 0.8rem;
    font-size: 0.95rem;
    outline: none;
    background: var(--input-bg);
    color: var(--text);
    width: 100%;
  }
  input[type=text]:focus { border-color: var(--accent-strong); }
  button {
    background: linear-gradient(135deg, #c471ed, #9b59b6);
    color: #fff;
    border: none;
    border-radius: 0.7rem;
    padding: 0.5rem 1rem;
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.5; cursor: default; }
  .row { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; }
  #status { font-size: 0.85rem; color: var(--accent); margin-top: 0.4rem; }
  #shareBox { display: none; }

  .theater {
    display: flex;
    gap: 1.2rem;
    flex-wrap: wrap;
    padding: 0 1.5rem 1.5rem;
    align-items: flex-start;
  }
  video {
    flex: 3 1 480px;
    min-width: 300px;
    width: 100%;
    border-radius: 0.8rem;
    background: #000;
    display: block;
  }
  .chat-col {
    flex: 1 1 280px;
    min-width: 260px;
    background: var(--card-bg);
    border-radius: 1rem;
    box-shadow: 0 4px 18px var(--shadow);
    padding: 1rem;
    display: flex;
    flex-direction: column;
    height: 70vh;
  }
  #chatLog { flex: 1; overflow-y: auto; margin-bottom: 0.6rem; padding-right: 0.2rem; }
  .msg { margin-bottom: 0.5rem; font-size: 0.92rem; line-height: 1.3; }
  .msg .avatar { margin-right: 0.3rem; }
  .msg .name { font-weight: 700; color: var(--accent); }
  .msg.system { color: var(--muted); font-style: italic; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .modal-card {
    background: var(--card-bg);
    border-radius: 1rem;
    box-shadow: 0 4px 18px var(--shadow);
    padding: 1.5rem;
    width: 320px;
    max-width: 90vw;
  }
  .modal-card h2 { margin: 0 0 1rem; color: var(--accent-strong); font-size: 1.1rem; }
  .modal-card input[type=text] { margin-bottom: 1rem; }
  .avatar-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.4rem;
    margin-bottom: 1rem;
  }
  .avatar-opt {
    background: var(--input-bg);
    border: 2px solid var(--border);
    border-radius: 0.6rem;
    font-size: 1.3rem;
    padding: 0.4rem 0;
    cursor: pointer;
  }
  .avatar-opt.selected { border-color: var(--accent-strong); background: var(--accent-strong); }

  /* theater mode: video + chat side by side, everything else dropped */
  .theater:fullscreen, .theater:-webkit-full-screen {
    background: #000;
    padding: 0;
    gap: 0;
    height: 100vh;
    flex-wrap: nowrap;
  }
  .theater:fullscreen video, .theater:-webkit-full-screen video {
    flex: 1 1 auto;
    height: 100vh;
    border-radius: 0;
    min-width: 0;
  }
  .theater:fullscreen .chat-col, .theater:-webkit-full-screen .chat-col {
    flex: 0 0 300px;
    height: 100vh;
    border-radius: 0;
    box-shadow: none;
  }
</style>
</head>
<body>
<header>
  <a href="/">&larr; back</a>
  <div class="header-right">
    <button id="avatarBtn" title="change name/avatar"></button>
    <button id="themeBtn">light mode</button>
  </div>
</header>
<div class="modal-overlay" id="profileModal">
  <div class="modal-card">
    <h2>your name &amp; avatar</h2>
    <input type="text" id="nameInput" placeholder="your name" maxlength="20">
    <div class="avatar-grid" id="avatarGrid"></div>
    <button id="saveProfileBtn">save</button>
  </div>
</div>
<div class="wrap">
  <div class="main-col">
    <h1>watch party</h1>
    <div class="card">
      <div class="row">
        <input type="text" id="urlInput" placeholder="paste an .mp4 URL">
        <button id="loadBtn">load</button>
      </div>
      <div id="shareBox" class="row">
        <input type="text" id="shareLink" readonly>
        <button id="copyBtn">copy link</button>
      </div>
      <div class="row" style="margin-bottom:0;">
        <button id="theaterBtn">🎬 theater mode</button>
      </div>
      <div id="status">starting…</div>
    </div>
  </div>
</div>
<div class="theater" id="theater">
  <video id="video" controls></video>
  <div class="chat-col">
    <div id="chatLog"></div>
    <div class="row" style="margin-bottom:0;">
      <input type="text" id="chatInput" placeholder="say something…">
      <button id="sendBtn">send</button>
    </div>
  </div>
</div>

<script>
// ponytail: sync is event-driven (play/pause/seek), no periodic drift correction.
// Good enough for a casual watch party; add a heartbeat re-sync if drift becomes annoying.

const video = document.getElementById('video');
const urlInput = document.getElementById('urlInput');
const loadBtn = document.getElementById('loadBtn');
const statusEl = document.getElementById('status');
const shareBox = document.getElementById('shareBox');
const shareLink = document.getElementById('shareLink');
const copyBtn = document.getElementById('copyBtn');
const chatLog = document.getElementById('chatLog');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const themeBtn = document.getElementById('themeBtn');
const theater = document.getElementById('theater');
const theaterBtn = document.getElementById('theaterBtn');
const avatarBtn = document.getElementById('avatarBtn');
const profileModal = document.getElementById('profileModal');
const nameInput = document.getElementById('nameInput');
const avatarGrid = document.getElementById('avatarGrid');
const saveProfileBtn = document.getElementById('saveProfileBtn');

function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === 'dark' ? 'light mode' : 'dark mode';
}
applyTheme(localStorage.getItem('wp_theme') || 'dark');
themeBtn.onclick = () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  localStorage.setItem('wp_theme', next);
  applyTheme(next);
};

theaterBtn.onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else theater.requestFullscreen();
};
document.addEventListener('fullscreenchange', () => {
  theaterBtn.textContent = document.fullscreenElement ? 'exit theater mode' : '🎬 theater mode';
});

const AVATARS = ['🐱', '🐶', '🦊', '🐼', '🐨', '🦁', '🐵', '🐰', '🦄', '🐯', '🐹', '🐷', '🐸', '🐙', '🦖'];

let myName = localStorage.getItem('wp_name') || ('Guest' + Math.floor(Math.random() * 1000));
let myAvatar = localStorage.getItem('wp_avatar') || AVATARS[Math.floor(Math.random() * AVATARS.length)];
localStorage.setItem('wp_name', myName);
localStorage.setItem('wp_avatar', myAvatar);

avatarBtn.textContent = myAvatar;
AVATARS.forEach(a => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'avatar-opt';
  b.textContent = a;
  b.onclick = () => {
    avatarGrid.querySelectorAll('.avatar-opt').forEach(el => el.classList.remove('selected'));
    b.classList.add('selected');
  };
  avatarGrid.appendChild(b);
});
function openProfileModal() {
  nameInput.value = myName;
  avatarGrid.querySelectorAll('.avatar-opt').forEach(el => el.classList.toggle('selected', el.textContent === myAvatar));
  profileModal.style.display = 'flex';
}
avatarBtn.onclick = openProfileModal;
profileModal.onclick = e => { if (e.target === profileModal) profileModal.style.display = 'none'; };
saveProfileBtn.onclick = () => {
  const n = nameInput.value.trim();
  if (n) myName = n;
  const picked = avatarGrid.querySelector('.avatar-opt.selected');
  if (picked) myAvatar = picked.textContent;
  localStorage.setItem('wp_name', myName);
  localStorage.setItem('wp_avatar', myAvatar);
  avatarBtn.textContent = myAvatar;
  profileModal.style.display = 'none';
};

const params = new URLSearchParams(location.search);
let roomId = params.get('room');
const isHost = !roomId;
if (isHost) {
  roomId = Math.random().toString(36).slice(2, 8);
  history.replaceState(null, '', location.pathname + '?room=' + roomId);
}

let peer, hostConn = null;
const conns = []; // host only
let applyingRemote = false;
let chatHistory = [];

function setStatus(s) { statusEl.textContent = s; }

function renderChat(msg) {
  const div = document.createElement('div');
  div.className = 'msg' + (msg.type === 'system' ? ' system' : '');
  if (msg.type === 'system') {
    div.textContent = msg.text;
  } else {
    const avSpan = document.createElement('span');
    avSpan.className = 'avatar';
    avSpan.textContent = msg.avatar || '💬';
    div.appendChild(avSpan);
    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    nameSpan.textContent = msg.name + ': ';
    div.appendChild(nameSpan);
    div.appendChild(document.createTextNode(msg.text));
  }
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function relay(msg) {
  if (isHost) conns.forEach(c => c.send(msg));
  else if (hostConn) hostConn.send(msg);
}

function addSystem(text) {
  const msg = { type: 'system', text };
  chatHistory.push(msg);
  renderChat(msg);
}

function broadcastSystem(text) {
  addSystem(text);
  if (isHost) conns.forEach(c => c.send({ type: 'system', text }));
}

function handleIncoming(msg, fromConn) {
  if (msg.type === 'chat' || msg.type === 'system') {
    chatHistory.push(msg);
    renderChat(msg);
  } else if (msg.type === 'join') {
    if (fromConn) { fromConn._name = msg.name; fromConn._avatar = msg.avatar; }
    addSystem(msg.avatar + ' ' + msg.name + ' joined the party 🎉');
  } else if (msg.type === 'sync') {
    if (msg.name && msg.action !== 'seek') {
      addSystem(msg.avatar + ' ' + msg.name + (msg.action === 'play' ? ' started playing the video' : ' paused the video'));
    }
    applyingRemote = true;
    if (Math.abs(video.currentTime - msg.time) > 0.6) video.currentTime = msg.time;
    if (msg.action === 'play') video.play(); else if (msg.action === 'pause') video.pause();
    setTimeout(() => { applyingRemote = false; }, 300);
  } else if (msg.type === 'load') {
    if (video.src !== msg.url) { video.src = msg.url; video.load(); }
    if (msg.name) addSystem(msg.avatar + ' ' + msg.name + ' loaded a new video');
  } else if (msg.type === 'state') {
    if (msg.url) { video.src = msg.url; video.currentTime = msg.time; if (!msg.paused) video.play(); }
    chatHistory = msg.chat || [];
    chatLog.innerHTML = '';
    chatHistory.forEach(renderChat);
  }
  if (isHost && fromConn) conns.forEach(c => { if (c !== fromConn) c.send(msg); });
}

function loadVideo(url) {
  video.src = url;
  video.load();
  addSystem(myAvatar + ' ' + myName + ' loaded a new video');
  relay({ type: 'load', url, name: myName, avatar: myAvatar });
}

loadBtn.onclick = () => {
  const url = urlInput.value.trim();
  if (url) loadVideo(url);
};

sendBtn.onclick = sendChat;
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

function sendChat() {
  const text = chatInput.value.trim();
  if (!text) return;
  const msg = { type: 'chat', name: myName, avatar: myAvatar, text };
  chatHistory.push(msg);
  renderChat(msg);
  relay(msg);
  chatInput.value = '';
}

['play', 'pause', 'seeked'].forEach(ev => {
  video.addEventListener(ev, () => {
    if (applyingRemote) return;
    const action = ev === 'seeked' ? 'seek' : ev;
    if (action !== 'seek') addSystem(myAvatar + ' ' + myName + (action === 'play' ? ' started playing the video' : ' paused the video'));
    relay({ type: 'sync', action, time: video.currentTime, name: myName, avatar: myAvatar });
  });
});
video.addEventListener('error', () => setStatus('could not load that video — check the URL allows direct/hotlink playback'));

peer = new Peer(isHost ? roomId : undefined);

peer.on('open', () => {
  if (isHost) {
    shareLink.value = location.href;
    shareBox.style.display = 'flex';
    setStatus('room open — share the link above. waiting for others…');
  } else {
    setStatus('connecting to host…');
    hostConn = peer.connect(roomId);
    hostConn.on('open', () => {
      setStatus('connected');
      hostConn.send({ type: 'join', name: myName, avatar: myAvatar });
      addSystem(myAvatar + ' you joined the party 🎉');
    });
    hostConn.on('data', msg => handleIncoming(msg));
    hostConn.on('close', () => setStatus('lost connection to host'));
  }
});

peer.on('connection', conn => {
  conns.push(conn);
  conn.on('open', () => {
    conn.send({ type: 'state', url: video.src || null, time: video.currentTime, paused: video.paused, chat: chatHistory });
    setStatus(conns.length + ' other viewer(s) connected');
  });
  conn.on('data', msg => handleIncoming(msg, conn));
  conn.on('close', () => {
    const i = conns.indexOf(conn);
    if (i > -1) conns.splice(i, 1);
    setStatus(conns.length + ' other viewer(s) connected');
    broadcastSystem((conn._avatar ? conn._avatar + ' ' : '') + (conn._name || 'someone') + ' left');
  });
});

peer.on('error', err => {
  if (!isHost && err.type === 'peer-unavailable') setStatus('room not found — the host may be offline');
  else setStatus('connection error: ' + err.type);
});

copyBtn.onclick = () => {
  navigator.clipboard.writeText(shareLink.value);
  copyBtn.textContent = 'copied!';
  setTimeout(() => copyBtn.textContent = 'copy link', 1200);
};
</script>
</body>
</html>
