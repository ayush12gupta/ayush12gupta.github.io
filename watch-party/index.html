<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>watch party | Ayush Gupta</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
<style>
  :root {
    --bg-grad: linear-gradient(135deg, #14121c 0%, #1c1428 100%);
    --card-bg: #1c1c26;
    --text: #eee;
    --accent: #c471ed;
    --accent-strong: #c98bf0;
    --border: #3a2a4a;
    --input-bg: #22222e;
    --shadow: rgba(0, 0, 0, 0.4);
    --muted: #999;
  }
  :root[data-theme="light"] {
    --bg-grad: linear-gradient(135deg, #fff0f6 0%, #f3e8ff 100%);
    --card-bg: #fff;
    --text: #333;
    --accent: #9b59b6;
    --accent-strong: #9b59b6;
    --border: #d8aaff;
    --input-bg: #fff;
    --shadow: rgba(200, 100, 200, 0.12);
    --muted: #999;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-grad);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }
  .header-right { display: flex; align-items: center; gap: 0.6rem; }
  #themeBtn {
    background: none;
    color: var(--text);
    border: 2px solid var(--border);
  }
  #avatarBtn {
    background: var(--input-bg);
    border: 2px solid var(--border);
    border-radius: 50%;
    width: 2.2rem;
    height: 2.2rem;
    padding: 0;
    font-size: 1.2rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 { margin: 0.2rem 0 0.8rem; color: var(--accent-strong); font-size: 1.5rem; }
  .wrap { padding: 0 1.5rem; }
  .main-col { max-width: 900px; }
  .card {
    background: var(--card-bg);
    border-radius: 1rem;
    box-shadow: 0 4px 18px var(--shadow);
    padding: 1rem;
    margin-bottom: 1rem;
  }
  input[type=text] {
    border: 2px solid var(--border);
    border-radius: 0.7rem;
    padding: 0.5rem 0.8rem;
    font-size: 0.95rem;
    outline: none;
    background: var(--input-bg);
    color: var(--text);
    width: 100%;
  }
  input[type=text]:focus { border-color: var(--accent-strong); }
  button {
    background: linear-gradient(135deg, #c471ed, #9b59b6);
    color: #fff;
    border: none;
    border-radius: 0.7rem;
    padding: 0.5rem 1rem;
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.5; cursor: default; }
  .row { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; }
  #status { font-size: 0.85rem; color: var(--accent); margin-top: 0.4rem; }
  #shareBox { display: none; }

  .theater {
    display: flex;
    gap: 1.2rem;
    flex-wrap: wrap;
    padding: 0 1.5rem 1.5rem;
    align-items: flex-start;
  }
  video {
    flex: 3 1 480px;
    min-width: 300px;
    width: 100%;
    border-radius: 0.8rem;
    background: #000;
    display: block;
  }
  .chat-col {
    position: relative;
    flex: 1 1 280px;
    min-width: 260px;
    background: var(--card-bg);
    border-radius: 1rem;
    box-shadow: 0 4px 18px var(--shadow);
    padding: 1rem;
    display: flex;
    flex-direction: column;
    height: 70vh;
  }
  .chat-input-bar {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    background: var(--input-bg);
    border: 2px solid var(--border);
    border-radius: 999px;
    padding: 0.3rem 0.5rem 0.3rem 1rem;
  }
  .chat-input-bar input[type=text] {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    padding: 0.4rem 0;
  }
  .chat-input-bar input[type=text]:focus { border-color: transparent; }
  .chat-input-bar button {
    background: none;
    border: none;
    color: var(--text);
    border-radius: 50%;
    width: 2.1rem;
    height: 2.1rem;
    padding: 0;
    flex-shrink: 0;
  }
  .chat-input-bar button:hover { background: var(--border); opacity: 1; }
  #emojiBtn { font-size: 1.1rem; }
  #gifBtn { font-size: 0.7rem; font-weight: 700; border-radius: 0.4rem; width: auto; padding: 0 0.5rem; background: var(--border); }
  .emoji-picker-wrap {
    display: none;
    position: absolute;
    bottom: 3.6rem;
    right: 1rem;
    z-index: 20;
    width: 320px;
    max-width: 90vw;
    height: 360px;
  }
  emoji-picker {
    width: 100%;
    height: 100%;
    box-shadow: 0 4px 18px var(--shadow);
    border-radius: 0.8rem;
    --background: var(--card-bg);
    --border-color: var(--border);
    --input-border-color: var(--border);
    --input-font-color: var(--text);
    --input-placeholder-color: var(--muted);
    --text-color: var(--text);
    --category-font-color: var(--muted);
    --button-hover-background: var(--input-bg);
    --button-active-background: var(--accent-strong);
    --indicator-color: var(--accent-strong);
  }
  #heartToggleBtn {
    position: absolute;
    top: 8px;
    right: 10px;
    z-index: 2;
    background: none;
    border: none;
    font-size: 1.3rem;
    padding: 0.2rem;
    line-height: 1;
    width: auto;
    height: auto;
  }
  .heart-dropdown {
    display: none;
    flex-direction: column;
    gap: 0.15rem;
    position: absolute;
    top: 42px;
    right: 8px;
    z-index: 3;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    box-shadow: 0 4px 18px var(--shadow);
    padding: 0.3rem;
  }
  .heart-dropdown.open { display: flex; }
  .heart-dropdown button {
    background: none;
    border: none;
    font-size: 1.25rem;
    padding: 0.25rem 0.4rem;
    border-radius: 0.4rem;
    width: auto;
    height: auto;
  }
  .heart-dropdown button:hover { background: var(--input-bg); }
  .gif-picker {
    display: none;
    flex-direction: column;
    gap: 0.5rem;
    position: absolute;
    bottom: 3.6rem;
    right: 1rem;
    z-index: 20;
    width: 320px;
    max-width: 90vw;
    height: 360px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 0.8rem;
    box-shadow: 0 4px 18px var(--shadow);
    padding: 0.6rem;
  }
  .gif-results {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.4rem;
    align-content: start;
  }
  .gif-results img { width: 100%; border-radius: 0.4rem; cursor: pointer; display: block; }
  .gif-results-msg { color: var(--muted); font-size: 0.85rem; grid-column: 1 / -1; }
  .gif-msg { max-width: 220px; border-radius: 0.6rem; display: block; margin-top: 0.2rem; }
  #chatLog { flex: 1; overflow-y: auto; margin-bottom: 0.6rem; padding-right: 0.2rem; }
  .msg { display: flex; gap: 0.6rem; align-items: flex-start; margin-bottom: 0.9rem; }
  .avatar-bubble {
    width: 2.1rem;
    height: 2.1rem;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .msg-body { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
  .msg-body .name { font-weight: 700; color: var(--text); font-size: 0.92rem; }
  .msg-body .line { font-size: 0.92rem; line-height: 1.35; color: var(--text); word-break: break-word; }
  .msg-body .line.system-line { color: var(--muted); }
  .msg-body .line.emoji-line { font-size: 2.2rem; line-height: 1.2; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .modal-card {
    background: var(--card-bg);
    border-radius: 1rem;
    box-shadow: 0 4px 18px var(--shadow);
    padding: 1.5rem;
    width: 320px;
    max-width: 90vw;
  }
  .modal-card h2 { margin: 0 0 1rem; color: var(--accent-strong); font-size: 1.1rem; }
  .modal-card input[type=text] { margin-bottom: 1rem; }
  .avatar-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.4rem;
    margin-bottom: 1rem;
  }
  .avatar-opt {
    background: var(--input-bg);
    border: 2px solid var(--border);
    border-radius: 0.6rem;
    font-size: 1.3rem;
    padding: 0.4rem 0;
    cursor: pointer;
  }
  .avatar-opt.selected { border-color: var(--accent-strong); background: var(--accent-strong); }

  /* theater mode: video + chat side by side, everything else dropped */
  .theater:fullscreen, .theater:-webkit-full-screen {
    background: #000;
    padding: 0;
    gap: 0;
    height: 100vh;
    flex-wrap: nowrap;
  }
  .theater:fullscreen video, .theater:-webkit-full-screen video {
    flex: 1 1 auto;
    height: 100vh;
    border-radius: 0;
    min-width: 0;
  }
  .theater:fullscreen .chat-col, .theater:-webkit-full-screen .chat-col {
    flex: 0 0 300px;
    height: 100vh;
    border-radius: 0;
    box-shadow: none;
  }
</style>
</head>
<body>
<header>
  <div class="header-right">
    <button id="avatarBtn" title="change name/avatar"></button>
    <button id="themeBtn">light mode</button>
  </div>
</header>
<div class="modal-overlay" id="profileModal">
  <div class="modal-card">
    <h2>your name &amp; avatar</h2>
    <input type="text" id="nameInput" placeholder="your name" maxlength="20">
    <div class="avatar-grid" id="avatarGrid"></div>
    <button id="saveProfileBtn">save</button>
  </div>
</div>
<div class="wrap">
  <div class="main-col">
    <h1>watch party</h1>
    <div class="card">
      <div class="row">
        <input type="text" id="urlInput" placeholder="paste an .mp4 URL">
        <button id="loadBtn">load</button>
      </div>
      <div id="shareBox" class="row">
        <input type="text" id="shareLink" readonly>
        <button id="copyBtn">copy link</button>
      </div>
      <div class="row" style="margin-bottom:0;">
        <button id="theaterBtn">🎬 theater mode</button>
      </div>
      <div id="status">starting…</div>
    </div>
  </div>
</div>
<div class="theater" id="theater">
  <video id="video" controls></video>
  <div class="chat-col">
    <div id="chatLog"></div>
    <div class="emoji-picker-wrap" id="emojiPickerWrap">
      <emoji-picker></emoji-picker>
      <button id="heartToggleBtn" type="button" title="heart color"></button>
      <div class="heart-dropdown" id="heartDropdown"></div>
    </div>
    <div class="gif-picker" id="gifPicker">
      <input type="text" id="gifSearch" placeholder="search GIFs…">
      <div class="gif-results" id="gifResults"></div>
    </div>
    <div class="chat-input-bar">
      <input type="text" id="chatInput" placeholder="Type a message…">
      <button id="emojiBtn" type="button" title="emoji"></button>
      <button id="gifBtn" type="button" title="GIF">GIF</button>
    </div>
  </div>
</div>

<script>
// ponytail: sync is event-driven (play/pause/seek), no periodic drift correction.
// Good enough for a casual watch party; add a heartbeat re-sync if drift becomes annoying.

const video = document.getElementById('video');
const urlInput = document.getElementById('urlInput');
const loadBtn = document.getElementById('loadBtn');
const statusEl = document.getElementById('status');
const shareBox = document.getElementById('shareBox');
const shareLink = document.getElementById('shareLink');
const copyBtn = document.getElementById('copyBtn');
const chatLog = document.getElementById('chatLog');
const chatInput = document.getElementById('chatInput');
const emojiBtn = document.getElementById('emojiBtn');
const emojiPicker = document.querySelector('emoji-picker');
const emojiPickerWrap = document.getElementById('emojiPickerWrap');
const heartToggleBtn = document.getElementById('heartToggleBtn');
const heartDropdown = document.getElementById('heartDropdown');
const gifBtn = document.getElementById('gifBtn');
const gifPicker = document.getElementById('gifPicker');
const gifSearch = document.getElementById('gifSearch');
const gifResults = document.getElementById('gifResults');
const themeBtn = document.getElementById('themeBtn');
const theater = document.getElementById('theater');
const theaterBtn = document.getElementById('theaterBtn');
const avatarBtn = document.getElementById('avatarBtn');
const profileModal = document.getElementById('profileModal');
const nameInput = document.getElementById('nameInput');
const avatarGrid = document.getElementById('avatarGrid');
const saveProfileBtn = document.getElementById('saveProfileBtn');

function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  themeBtn.textContent = t === 'dark' ? 'light mode' : 'dark mode';
}
applyTheme(localStorage.getItem('wp_theme') || 'dark');
themeBtn.onclick = () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  localStorage.setItem('wp_theme', next);
  applyTheme(next);
};

theaterBtn.onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else theater.requestFullscreen();
};
document.addEventListener('fullscreenchange', () => {
  theaterBtn.textContent = document.fullscreenElement ? 'exit theater mode' : '🎬 theater mode';
});

const AVATARS = ['🐱', '🐶', '🦊', '🐼', '🐨', '🦁', '🐵', '🐰', '🦄', '🐯', '🐹', '🐷', '🐸', '🐙', '🦖'];
const HEARTS = ['💜', '❤️', '🧡', '💚', '💙', '🩷', '🤍', '🤎'];

let myName = localStorage.getItem('wp_name') || ('Guest' + Math.floor(Math.random() * 1000));
let myAvatar = localStorage.getItem('wp_avatar') || AVATARS[Math.floor(Math.random() * AVATARS.length)];
let myHeart = localStorage.getItem('wp_heart') || '💜';
localStorage.setItem('wp_name', myName);
localStorage.setItem('wp_avatar', myAvatar);
localStorage.setItem('wp_heart', myHeart);

function refreshAvatarBtn() {
  avatarBtn.textContent = myAvatar;
  avatarBtn.style.background = colorFor(myName);
}
refreshAvatarBtn();
AVATARS.forEach(a => {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'avatar-opt';
  b.textContent = a;
  b.onclick = () => {
    avatarGrid.querySelectorAll('.avatar-opt').forEach(el => el.classList.remove('selected'));
    b.classList.add('selected');
  };
  avatarGrid.appendChild(b);
});
function openProfileModal() {
  nameInput.value = myName;
  avatarGrid.querySelectorAll('.avatar-opt').forEach(el => el.classList.toggle('selected', el.textContent === myAvatar));
  profileModal.style.display = 'flex';
}
avatarBtn.onclick = openProfileModal;
profileModal.onclick = e => { if (e.target === profileModal) profileModal.style.display = 'none'; };
saveProfileBtn.onclick = () => {
  const n = nameInput.value.trim();
  if (n) myName = n;
  const picked = avatarGrid.querySelector('.avatar-opt.selected');
  if (picked) myAvatar = picked.textContent;
  localStorage.setItem('wp_name', myName);
  localStorage.setItem('wp_avatar', myAvatar);
  refreshAvatarBtn();
  profileModal.style.display = 'none';
};

const params = new URLSearchParams(location.search);
let roomId = params.get('room');
const isHost = !roomId;
if (isHost) {
  roomId = Math.random().toString(36).slice(2, 8);
  history.replaceState(null, '', location.pathname + '?room=' + roomId);
}

let peer, hostConn = null;
const conns = []; // host only
let applyingRemote = false;
let chatHistory = [];

function setStatus(s) { statusEl.textContent = s; }

function colorFor(name) {
  let h = 0;
  for (let i = 0; i < (name || '').length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return 'hsl(' + h + ', 55%, 55%)';
}

let lastMsgName = null;
let lastGroupBody = null;

const EMOJI_ONLY_RE = /^(\p{Extended_Pictographic}|\p{Emoji_Modifier}|‍|️|\s)+$/u;

function renderChat(msg) {
  const line = document.createElement('div');
  line.className = 'line' + (msg.type === 'system' ? ' system-line' : '');
  if (msg.gif) {
    const img = document.createElement('img');
    img.className = 'gif-msg';
    img.src = msg.gif;
    line.appendChild(img);
  } else {
    line.textContent = msg.text;
    if (EMOJI_ONLY_RE.test(msg.text)) line.classList.add('emoji-line');
  }

  if (msg.name && msg.name === lastMsgName && lastGroupBody) {
    lastGroupBody.appendChild(line);
  } else {
    const row = document.createElement('div');
    row.className = 'msg';
    const av = document.createElement('div');
    av.className = 'avatar-bubble';
    av.textContent = msg.avatar || '💬';
    av.style.background = colorFor(msg.name);
    row.appendChild(av);
    const body = document.createElement('div');
    body.className = 'msg-body';
    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = msg.name || '';
    body.appendChild(nameEl);
    body.appendChild(line);
    row.appendChild(body);
    chatLog.appendChild(row);
    lastGroupBody = body;
  }
  lastMsgName = msg.name;
  chatLog.scrollTop = chatLog.scrollHeight;
}

function relay(msg) {
  if (isHost) conns.forEach(c => c.send(msg));
  else if (hostConn) hostConn.send(msg);
}

function addSystem(name, avatar, text) {
  const msg = { type: 'system', name, avatar, text };
  chatHistory.push(msg);
  renderChat(msg);
}

function broadcastSystem(name, avatar, text) {
  addSystem(name, avatar, text);
  if (isHost) conns.forEach(c => c.send({ type: 'system', name, avatar, text }));
}

function handleIncoming(msg, fromConn) {
  if (msg.type === 'chat' || msg.type === 'system') {
    chatHistory.push(msg);
    renderChat(msg);
  } else if (msg.type === 'join') {
    if (fromConn) { fromConn._name = msg.name; fromConn._avatar = msg.avatar; }
    addSystem(msg.name, msg.avatar, 'joined the party 🎉');
  } else if (msg.type === 'sync') {
    if (msg.name) {
      if (msg.action === 'seek') addSystem(msg.name, msg.avatar, 'jumped to ' + formatTime(msg.time));
      else addSystem(msg.name, msg.avatar, msg.action === 'play' ? 'started playing the video' : 'paused the video');
    }
    applyingRemote = true;
    if (Math.abs(video.currentTime - msg.time) > 0.6) video.currentTime = msg.time;
    if (msg.action === 'play') video.play(); else if (msg.action === 'pause') video.pause();
    setTimeout(() => { applyingRemote = false; }, 300);
  } else if (msg.type === 'load') {
    if (video.src !== msg.url) { video.src = msg.url; video.load(); }
    if (msg.name) addSystem(msg.name, msg.avatar, 'loaded a new video');
  } else if (msg.type === 'state') {
    if (msg.url) { video.src = msg.url; video.currentTime = msg.time; if (!msg.paused) video.play(); }
    chatHistory = msg.chat || [];
    chatLog.innerHTML = '';
    lastMsgName = null;
    lastGroupBody = null;
    chatHistory.forEach(renderChat);
  }
  if (isHost && fromConn) conns.forEach(c => { if (c !== fromConn) c.send(msg); });
}

function loadVideo(url) {
  video.src = url;
  video.load();
  addSystem(myName, myAvatar, 'loaded a new video');
  relay({ type: 'load', url, name: myName, avatar: myAvatar });
}

loadBtn.onclick = () => {
  const url = urlInput.value.trim();
  if (url) loadVideo(url);
};


emojiBtn.onclick = () => {
  emojiPickerWrap.style.display = emojiPickerWrap.style.display === 'block' ? 'none' : 'block';
};
emojiPicker.addEventListener('emoji-click', e => {
  chatInput.value += e.detail.unicode;
  chatInput.focus();
});
document.addEventListener('click', e => {
  if (emojiPickerWrap.style.display === 'block' && !emojiPickerWrap.contains(e.target) && e.target !== emojiBtn) {
    emojiPickerWrap.style.display = 'none';
    heartDropdown.classList.remove('open');
  }
});

// the picker's built-in skin-tone button (hand emoji, top-right) only supports real
// Unicode skin-tone modifiers, which hearts don't have — so we hide it via the
// library's documented shadow-root style injection and use our own heart-color
// button in its place instead of fighting the built-in control's real purpose.
customElements.whenDefined('emoji-picker').then(() => {
  const style = document.createElement('style');
  style.textContent = '.skintone-button-wrapper, #skintone-list { display: none !important; }';
  emojiPicker.shadowRoot.appendChild(style);
});

function setHeart(h) {
  myHeart = h;
  localStorage.setItem('wp_heart', myHeart);
  emojiBtn.textContent = myHeart;
  heartToggleBtn.textContent = myHeart;
}
setHeart(myHeart);
HEARTS.forEach(h => {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = h;
  b.onclick = () => {
    setHeart(h);
    heartDropdown.classList.remove('open');
  };
  heartDropdown.appendChild(b);
});
heartToggleBtn.onclick = e => {
  e.stopPropagation();
  heartDropdown.classList.toggle('open');
};
document.addEventListener('click', e => {
  if (heartDropdown.classList.contains('open') && !heartDropdown.contains(e.target) && e.target !== heartToggleBtn) {
    heartDropdown.classList.remove('open');
  }
});

// get a free beta key at https://developers.giphy.com/dashboard and paste it here
const GIPHY_API_KEY = 'LXS78tYn6mmFGl9N0oL2J2OqtmbDaxR8';

let gifSearchTimer = null;

function loadGifs(query) {
  gifResults.innerHTML = '<div class="gif-results-msg">loading…</div>';
  const url = query
    ? 'https://api.giphy.com/v1/gifs/search?api_key=' + GIPHY_API_KEY + '&q=' + encodeURIComponent(query) + '&limit=20&rating=pg-13'
    : 'https://api.giphy.com/v1/gifs/trending?api_key=' + GIPHY_API_KEY + '&limit=20&rating=pg-13';
  fetch(url).then(r => r.json()).then(data => {
    gifResults.innerHTML = '';
    const results = data.data || [];
    if (!results.length) { gifResults.innerHTML = '<div class="gif-results-msg">no GIFs found</div>'; return; }
    results.forEach(g => {
      const img = document.createElement('img');
      img.src = g.images.fixed_width_small.url;
      img.onclick = () => sendGif(g.images.fixed_width.url);
      gifResults.appendChild(img);
    });
  }).catch(() => { gifResults.innerHTML = '<div class="gif-results-msg">could not load GIFs — check the GIPHY API key</div>'; });
}

function sendGif(url) {
  const msg = { type: 'chat', name: myName, avatar: myAvatar, gif: url };
  chatHistory.push(msg);
  renderChat(msg);
  relay(msg);
  gifPicker.style.display = 'none';
}

gifBtn.onclick = () => {
  const opening = gifPicker.style.display !== 'flex';
  gifPicker.style.display = opening ? 'flex' : 'none';
  if (opening && !gifResults.children.length) loadGifs('');
};
gifSearch.addEventListener('input', () => {
  clearTimeout(gifSearchTimer);
  gifSearchTimer = setTimeout(() => loadGifs(gifSearch.value.trim()), 400);
});
document.addEventListener('click', e => {
  if (gifPicker.style.display === 'flex' && !gifPicker.contains(e.target) && e.target !== gifBtn) {
    gifPicker.style.display = 'none';
  }
});
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

function sendChat() {
  const text = chatInput.value.trim();
  if (!text) return;
  const msg = { type: 'chat', name: myName, avatar: myAvatar, text };
  chatHistory.push(msg);
  renderChat(msg);
  relay(msg);
  chatInput.value = '';
}

function formatTime(s) {
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const mm = String(m).padStart(2, '0'), ss = String(sec).padStart(2, '0');
  return h > 0 ? h + ':' + mm + ':' + ss : m + ':' + ss;
}

// ponytail: dragging the native seek bar makes the browser pause *before* 'seeking'
// fires, then resume after 'seeked' — both are scrub artifacts, not real user actions.
// The trailing resume is caught by a cooldown; the leading pause is caught by delaying
// its report briefly so a following 'seeking' can cancel it. Not foolproof across every
// browser, but covers common Chrome/Safari scrub behavior.
let seekCooldown = false;
let pendingPause = null;
video.addEventListener('seeking', () => {
  seekCooldown = true;
  if (pendingPause) { clearTimeout(pendingPause); pendingPause = null; }
});
video.addEventListener('seeked', () => {
  if (!applyingRemote) {
    addSystem(myName, myAvatar, 'jumped to ' + formatTime(video.currentTime));
    relay({ type: 'sync', action: 'seek', time: video.currentTime, name: myName, avatar: myAvatar });
  }
  setTimeout(() => { seekCooldown = false; }, 400);
});
video.addEventListener('pause', () => {
  if (applyingRemote || seekCooldown) return;
  pendingPause = setTimeout(() => {
    pendingPause = null;
    addSystem(myName, myAvatar, 'paused the video');
    relay({ type: 'sync', action: 'pause', time: video.currentTime, name: myName, avatar: myAvatar });
  }, 150);
});
video.addEventListener('play', () => {
  if (applyingRemote || seekCooldown) return;
  addSystem(myName, myAvatar, 'started playing the video');
  relay({ type: 'sync', action: 'play', time: video.currentTime, name: myName, avatar: myAvatar });
});
video.addEventListener('error', () => setStatus('could not load that video — check the URL allows direct/hotlink playback'));

peer = new Peer(isHost ? roomId : undefined);

peer.on('open', () => {
  if (isHost) {
    shareLink.value = location.href;
    shareBox.style.display = 'flex';
    setStatus('room open — share the link above. waiting for others…');
  } else {
    setStatus('connecting to host…');
    hostConn = peer.connect(roomId);
    hostConn.on('open', () => {
      setStatus('connected');
      hostConn.send({ type: 'join', name: myName, avatar: myAvatar });
      addSystem(myName, myAvatar, 'joined the party 🎉');
    });
    hostConn.on('data', msg => handleIncoming(msg));
    hostConn.on('close', () => setStatus('lost connection to host'));
  }
});

peer.on('connection', conn => {
  conns.push(conn);
  conn.on('open', () => {
    conn.send({ type: 'state', url: video.src || null, time: video.currentTime, paused: video.paused, chat: chatHistory });
    setStatus(conns.length + ' other viewer(s) connected');
  });
  conn.on('data', msg => handleIncoming(msg, conn));
  conn.on('close', () => {
    const i = conns.indexOf(conn);
    if (i > -1) conns.splice(i, 1);
    setStatus(conns.length + ' other viewer(s) connected');
    broadcastSystem(conn._name || 'someone', conn._avatar || '💬', 'left');
  });
});

peer.on('error', err => {
  if (!isHost && err.type === 'peer-unavailable') setStatus('room not found — the host may be offline');
  else setStatus('connection error: ' + err.type);
});

copyBtn.onclick = () => {
  navigator.clipboard.writeText(shareLink.value);
  copyBtn.textContent = 'copied!';
  setTimeout(() => copyBtn.textContent = 'copy link', 1200);
};
</script>
</body>
</html>
