<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>watch party | Ayush Gupta</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #fff0f6 0%, #f3e8ff 100%);
    color: #333;
    min-height: 100vh;
  }
  header {
    padding: 1rem 1.5rem;
  }
  header a { color: #9b59b6; text-decoration: none; font-weight: 600; }
  h1 { margin: 0.2rem 0 0.8rem; color: #9b59b6; font-size: 1.5rem; }
  .wrap {
    display: flex;
    gap: 1.2rem;
    flex-wrap: wrap;
    padding: 0 1.5rem 1.5rem;
    align-items: flex-start;
  }
  .main-col { flex: 3 1 480px; min-width: 300px; }
  .chat-col {
    flex: 1 1 280px;
    min-width: 260px;
    background: #fff;
    border-radius: 1rem;
    box-shadow: 0 4px 18px rgba(200, 100, 200, 0.12);
    padding: 1rem;
    display: flex;
    flex-direction: column;
    height: 70vh;
  }
  .card {
    background: #fff;
    border-radius: 1rem;
    box-shadow: 0 4px 18px rgba(200, 100, 200, 0.12);
    padding: 1rem;
    margin-bottom: 1rem;
  }
  input[type=text] {
    border: 2px solid #d8aaff;
    border-radius: 0.7rem;
    padding: 0.5rem 0.8rem;
    font-size: 0.95rem;
    outline: none;
    background: #fff;
    color: #333;
    width: 100%;
  }
  input[type=text]:focus { border-color: #9b59b6; }
  button {
    background: linear-gradient(135deg, #c471ed, #9b59b6);
    color: #fff;
    border: none;
    border-radius: 0.7rem;
    padding: 0.5rem 1rem;
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.5; cursor: default; }
  .row { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; }
  video { width: 100%; border-radius: 0.8rem; background: #000; display: block; }
  #status { font-size: 0.85rem; color: #9b59b6; margin-top: 0.4rem; }
  #shareBox { display: none; }
  #shareBox input { background: #faf0ff; }
  #chatLog {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 0.6rem;
    padding-right: 0.2rem;
  }
  .msg { margin-bottom: 0.5rem; font-size: 0.92rem; line-height: 1.3; }
  .msg .name { font-weight: 700; color: #9b59b6; }
  .msg.system { color: #999; font-style: italic; }
</style>
</head>
<body>
<header><a href="/">&larr; back</a></header>
<div class="wrap">
  <div class="main-col">
    <h1>watch party</h1>
    <div class="card">
      <div class="row">
        <input type="text" id="urlInput" placeholder="paste an .mp4 URL">
        <button id="loadBtn">load</button>
      </div>
      <div id="shareBox" class="row">
        <input type="text" id="shareLink" readonly>
        <button id="copyBtn">copy link</button>
      </div>
      <div id="status">starting…</div>
    </div>
    <video id="video" controls></video>
  </div>
  <div class="chat-col">
    <div id="chatLog"></div>
    <div class="row" style="margin-bottom:0;">
      <input type="text" id="chatInput" placeholder="say something…">
      <button id="sendBtn">send</button>
    </div>
  </div>
</div>

<script>
// ponytail: sync is event-driven (play/pause/seek), no periodic drift correction.
// Good enough for a casual watch party; add a heartbeat re-sync if drift becomes annoying.

const video = document.getElementById('video');
const urlInput = document.getElementById('urlInput');
const loadBtn = document.getElementById('loadBtn');
const statusEl = document.getElementById('status');
const shareBox = document.getElementById('shareBox');
const shareLink = document.getElementById('shareLink');
const copyBtn = document.getElementById('copyBtn');
const chatLog = document.getElementById('chatLog');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');

const myName = localStorage.getItem('wp_name') || (() => {
  const n = prompt('Your name for chat:', '') || ('Guest' + Math.floor(Math.random() * 1000));
  localStorage.setItem('wp_name', n);
  return n;
})();

const params = new URLSearchParams(location.search);
let roomId = params.get('room');
const isHost = !roomId;
if (isHost) {
  roomId = Math.random().toString(36).slice(2, 8);
  history.replaceState(null, '', location.pathname + '?room=' + roomId);
}

let peer, hostConn = null;
const conns = []; // host only
let applyingRemote = false;
let chatHistory = [];

function setStatus(s) { statusEl.textContent = s; }

function renderChat(msg) {
  const div = document.createElement('div');
  div.className = 'msg' + (msg.type === 'system' ? ' system' : '');
  if (msg.type === 'system') {
    div.textContent = msg.text;
  } else {
    const nameSpan = document.createElement('span');
    nameSpan.className = 'name';
    nameSpan.textContent = msg.name + ': ';
    div.appendChild(nameSpan);
    div.appendChild(document.createTextNode(msg.text));
  }
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function relay(msg) {
  if (isHost) conns.forEach(c => c.send(msg));
  else if (hostConn) hostConn.send(msg);
}

function handleIncoming(msg, fromConn) {
  if (msg.type === 'chat') {
    chatHistory.push(msg);
    renderChat(msg);
  } else if (msg.type === 'sync') {
    applyingRemote = true;
    if (Math.abs(video.currentTime - msg.time) > 0.6) video.currentTime = msg.time;
    if (msg.action === 'play') video.play(); else if (msg.action === 'pause') video.pause();
    setTimeout(() => { applyingRemote = false; }, 300);
  } else if (msg.type === 'load') {
    if (video.src !== msg.url) { video.src = msg.url; video.load(); }
  } else if (msg.type === 'state') {
    if (msg.url) { video.src = msg.url; video.currentTime = msg.time; if (!msg.paused) video.play(); }
    chatHistory = msg.chat || [];
    chatLog.innerHTML = '';
    chatHistory.forEach(renderChat);
  }
  if (isHost && fromConn) conns.forEach(c => { if (c !== fromConn) c.send(msg); });
}

function loadVideo(url) {
  video.src = url;
  video.load();
  relay({ type: 'load', url });
}

loadBtn.onclick = () => {
  const url = urlInput.value.trim();
  if (url) loadVideo(url);
};

sendBtn.onclick = sendChat;
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

function sendChat() {
  const text = chatInput.value.trim();
  if (!text) return;
  const msg = { type: 'chat', name: myName, text };
  chatHistory.push(msg);
  renderChat(msg);
  relay(msg);
  chatInput.value = '';
}

['play', 'pause', 'seeked'].forEach(ev => {
  video.addEventListener(ev, () => {
    if (applyingRemote) return;
    relay({ type: 'sync', action: ev === 'seeked' ? 'seek' : ev, time: video.currentTime });
  });
});
video.addEventListener('error', () => setStatus('could not load that video — check the URL allows direct/hotlink playback'));

peer = new Peer(isHost ? roomId : undefined);

peer.on('open', () => {
  if (isHost) {
    shareLink.value = location.href;
    shareBox.style.display = 'flex';
    setStatus('room open — share the link above. waiting for others…');
  } else {
    setStatus('connecting to host…');
    hostConn = peer.connect(roomId);
    hostConn.on('open', () => setStatus('connected'));
    hostConn.on('data', msg => handleIncoming(msg));
    hostConn.on('close', () => setStatus('lost connection to host'));
  }
});

peer.on('connection', conn => {
  conns.push(conn);
  conn.on('open', () => {
    conn.send({ type: 'state', url: video.src || null, time: video.currentTime, paused: video.paused, chat: chatHistory });
    setStatus(conns.length + ' other viewer(s) connected');
  });
  conn.on('data', msg => handleIncoming(msg, conn));
  conn.on('close', () => {
    const i = conns.indexOf(conn);
    if (i > -1) conns.splice(i, 1);
    setStatus(conns.length + ' other viewer(s) connected');
  });
});

peer.on('error', err => {
  if (!isHost && err.type === 'peer-unavailable') setStatus('room not found — the host may be offline');
  else setStatus('connection error: ' + err.type);
});

copyBtn.onclick = () => {
  navigator.clipboard.writeText(shareLink.value);
  copyBtn.textContent = 'copied!';
  setTimeout(() => copyBtn.textContent = 'copy link', 1200);
};
</script>
</body>
</html>
