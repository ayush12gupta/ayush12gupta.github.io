<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>watch party | Ayush Gupta</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
<style>
  :root {
    --bg-grad: linear-gradient(135deg, #14121c 0%, #1c1428 100%);
    --card-bg: #1c1c26;
    --text: #eee;
    --accent: #c471ed;
    --accent-strong: #c98bf0;
    --border: #3a2a4a;
    --input-bg: #22222e;
    --shadow: rgba(0, 0, 0, 0.4);
    --muted: #999;
  }
  :root[data-theme="light"] {
    --bg-grad: linear-gradient(135deg, #fff0f6 0%, #f3e8ff 100%);
    --card-bg: #fff;
    --text: #333;
    --accent: #9b59b6;
    --accent-strong: #9b59b6;
    --border: #d8aaff;
    --input-bg: #fff;
    --shadow: rgba(200, 100, 200, 0.12);
    --muted: #999;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-grad);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }
  .header-right { display: flex; align-items: center; gap: 0.6rem; }
  #themeBtn {
    background: none;
    color: var(--text);
    border: 2px solid var(--border);
  }
  #dinoBtn, #membersBtn, #avatarBtn {
    background: var(--input-bg);
    border: 2px solid var(--border);
    border-radius: 50%;
    width: 2.2rem;
    height: 2.2rem;
    padding: 0;
    font-size: 1.2rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 { margin: 0.2rem 0 0.8rem; color: var(--accent-strong); font-size: 1.5rem; }
  .dino {
    --dino-right-limit: calc(100vw - 52px);
    position: fixed;
    bottom: 0.5rem;
    left: 0;
    width: 52px;
    height: 40px;
    z-index: 5;
    pointer-events: none;
    animation: dino-run-across 18s linear infinite, dino-face 18s steps(1) infinite;
  }
  @keyframes dino-run-across {
    0% { left: 0; }
    50% { left: var(--dino-right-limit); }
    100% { left: 0; }
  }
  @keyframes dino-face {
    0%, 49.9% { transform: scaleX(1); }
    50%, 99.9% { transform: scaleX(-1); }
    100% { transform: scaleX(1); }
  }
  .dino div { position: absolute; background: #4d9e3f; }
  .dino .tail {
    left: 0; top: 15px; width: 15px; height: 11px;
    clip-path: polygon(0% 35%, 70% 0%, 100% 50%, 70% 100%);
  }
  .dino .body { left: 12px; top: 15px; width: 20px; height: 13px; border-radius: 2px 6px 2px 2px; }
  .dino .neck { left: 28px; top: 7px; width: 8px; height: 10px; border-radius: 2px; }
  .dino .head { left: 34px; top: 0; width: 14px; height: 13px; border-radius: 2px 6px 3px 2px; }
  .dino .jaw { left: 44px; top: 9px; width: 8px; height: 4px; border-radius: 0 2px 2px 3px; }
  .dino .eye { left: 44px; top: 3px; width: 2px; height: 2px; background: var(--card-bg); border-radius: 50%; }
  .dino .arm { left: 30px; top: 19px; width: 6px; height: 3px; border-radius: 1px; }
  .dino .leg1, .dino .leg2 {
    top: 26px; width: 5px; height: 9px; border-radius: 1px; transform-origin: top center;
  }
  .dino .leg1::after, .dino .leg2::after {
    content: ''; position: absolute; left: -2px; bottom: -3px;
    width: 9px; height: 3px; background: #4d9e3f; border-radius: 1px;
  }
  .dino .leg1 { left: 18px; animation: dino-leg 0.35s steps(1) infinite; }
  .dino .leg2 { left: 26px; animation: dino-leg 0.35s steps(1) infinite reverse; }
  @keyframes dino-leg {
    0%, 49.9% { transform: rotate(0deg) translateY(0); }
    50%, 100% { transform: rotate(-18deg) translateY(-3px); }
  }
  html.dino-off .dino { display: none !important; }
  .wrap { padding: 0 1.5rem; }
  .main-col { max-width: 900px; }
  .card {
    background: var(--card-bg);
    border-radius: 1rem;
    box-shadow: 0 4px 18px var(--shadow);
    padding: 1rem;
    margin-bottom: 1rem;
  }
  input[type=text] {
    border: 2px solid var(--border);
    border-radius: 0.7rem;
    padding: 0.5rem 0.8rem;
    font-size: 0.95rem;
    outline: none;
    background: var(--input-bg);
    color: var(--text);
    width: 100%;
  }
  input[type=text]:focus { border-color: var(--accent-strong); }
  button {
    background: linear-gradient(135deg, #c471ed, #9b59b6);
    color: #fff;
    border: none;
    border-radius: 0.7rem;
    padding: 0.5rem 1rem;
    font-size: 0.9rem;
    cursor: pointer;
    font-weight: 600;
    white-space: nowrap;
  }
  button:hover { opacity: 0.85; }
  button:disabled { opacity: 0.5; cursor: default; }
  .row { display: flex; gap: 0.5rem; margin-bottom: 0.6rem; }
  #status { font-size: 0.85rem; color: var(--accent); margin-top: 0.4rem; }
  #shareBox { display: none; }

  .theater {
    display: flex;
    gap: 1.2rem;
    flex-wrap: wrap;
    padding: 0 1.5rem 1.5rem;
    align-items: flex-start;
  }
  .video-wrap {
    position: relative;
    flex: 3 1 480px;
    min-width: 300px;
    width: 100%;
  }
  .video-wrap video {
    width: 100%;
    height: 100%;
    border-radius: 0.8rem;
    background: #000;
    display: block;
  }
  .chat-toolbar {
    display: none;
    gap: 0.4rem;
    margin-bottom: 0.6rem;
  }
  .chat-toolbar button {
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 0.8rem;
    padding: 0.3rem 0.5rem;
    border-radius: 0.4rem;
    width: auto;
    height: auto;
  }
  #hideChatBtn { flex: 1; }
  .theater:fullscreen .chat-toolbar, .theater:-webkit-full-screen .chat-toolbar { display: flex; }
  .chat-peek-zone {
    display: none;
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 110px;
    z-index: 14;
  }
  .show-chat-btn {
    position: absolute;
    top: 1rem;
    right: 1rem;
    z-index: 15;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  #theater.chat-hidden .chat-col { display: none; }
  #theater.chat-hidden .chat-peek-zone { display: block; }
  .chat-peek-zone:hover .show-chat-btn { opacity: 1; pointer-events: auto; }
  .chat-col {
    position: relative;
    flex: 1 1 260px;
    min-width: 220px;
    max-width: 320px;
    background: var(--card-bg);
    border-radius: 1rem;
    box-shadow: 0 4px 18px var(--shadow);
    padding: 1rem;
    display: flex;
    flex-direction: column;
    height: 70vh;
  }
  .quick-emoji-row {
    display: flex;
    gap: 0.2rem;
    margin-bottom: 0.5rem;
    overflow-x: auto;
  }
  .quick-emoji-row button {
    background: none;
    border: none;
    font-size: 1.3rem;
    padding: 0.2rem 0.35rem;
    border-radius: 0.4rem;
    width: auto;
    height: auto;
    flex-shrink: 0;
  }
  .quick-emoji-row button:hover { background: var(--input-bg); }
  .chat-input-bar {
    display: flex;
    align-items: center;
    gap: 0.3rem;
    background: var(--input-bg);
    border: 2px solid var(--border);
    border-radius: 999px;
    padding: 0.3rem 0.5rem 0.3rem 1rem;
  }
  .chat-input-bar input[type=text] {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    padding: 0.4rem 0;
  }
  .chat-input-bar input[type=text]:focus { border-color: transparent; }
  .chat-input-bar button {
    background: none;
    border: none;
    color: var(--text);
    border-radius: 50%;
    width: 2.1rem;
    height: 2.1rem;
    padding: 0;
    flex-shrink: 0;
  }
  .chat-input-bar button:hover { background: var(--border); opacity: 1; }
  #emojiBtn { font-size: 1.1rem; }
  #gifBtn { font-size: 0.7rem; font-weight: 700; border-radius: 0.4rem; width: auto; padding: 0 0.5rem; background: var(--border); }
  .emoji-picker-wrap {
    display: none;
    position: absolute;
    bottom: 3.6rem;
    right: 1rem;
    z-index: 20;
    width: 320px;
    max-width: 90vw;
    height: 360px;
  }
  emoji-picker {
    width: 100%;
    height: 100%;
    box-shadow: 0 4px 18px var(--shadow);
    border-radius: 0.8rem;
    --background: var(--card-bg);
    --border-color: var(--border);
    --input-border-color: var(--border);
    --input-font-color: var(--text);
    --input-placeholder-color: var(--muted);
    --text-color: var(--text);
    --category-font-color: var(--muted);
    --button-hover-background: var(--input-bg);
    --button-active-background: var(--accent-strong);
    --indicator-color: var(--accent-strong);
  }
  #heartToggleBtn {
    position: absolute;
    top: 0.5rem;
    right: 0.6rem;
    height: 2.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    background: none;
    border: none;
    font-size: 1.3rem;
    padding: 0 0.2rem;
    line-height: 1;
    width: auto;
  }
  .heart-dropdown {
    display: none;
    flex-direction: column;
    gap: 0.15rem;
    position: absolute;
    top: 2.9rem;
    right: 8px;
    z-index: 3;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    box-shadow: 0 4px 18px var(--shadow);
    padding: 0.3rem;
  }
  .heart-dropdown.open { display: flex; }
  .heart-dropdown button {
    background: none;
    border: none;
    font-size: 1.25rem;
    padding: 0.25rem 0.4rem;
    border-radius: 0.4rem;
    width: auto;
    height: auto;
  }
  .heart-dropdown button:hover { background: var(--input-bg); }
  .gif-picker {
    display: none;
    flex-direction: column;
    gap: 0.5rem;
    position: absolute;
    bottom: 3.6rem;
    right: 1rem;
    z-index: 20;
    width: 320px;
    max-width: 90vw;
    height: 360px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 0.8rem;
    box-shadow: 0 4px 18px var(--shadow);
    padding: 0.6rem;
  }
  .gif-results {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.4rem;
    align-content: start;
  }
  .gif-results img { width: 100%; border-radius: 0.4rem; cursor: pointer; display: block; }
  .gif-results-msg { color: var(--muted); font-size: 0.85rem; grid-column: 1 / -1; }
  .gif-msg { max-width: 220px; border-radius: 0.6rem; display: block; margin-top: 0.2rem; }
  #chatLog { flex: 1; overflow-y: auto; margin-bottom: 0.6rem; padding-right: 0.2rem; }
  .typing-indicator { display: none; font-size: 0.8rem; color: var(--muted); font-style: italic; padding: 0 0 0.4rem; }
  .msg { display: flex; gap: 0.6rem; align-items: flex-start; margin-bottom: 0.9rem; }
  .avatar-bubble {
    width: 2.1rem;
    height: 2.1rem;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .msg-body { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; flex: 1 1 auto; }
  .msg-body .name { font-weight: 700; color: var(--text); font-size: 0.92rem; }
  .msg-body .line { font-size: 0.92rem; line-height: 1.35; color: var(--text); word-break: break-word; }
  .msg-body .line.system-line { color: var(--muted); }
  .msg-body .line.emoji-line { font-size: 2.2rem; line-height: 1.2; }
  .msg-line-wrap { position: relative; }
  .reply-quote {
    font-size: 0.8rem;
    color: var(--muted);
    border-left: 2px solid var(--border);
    padding-left: 0.4rem;
    margin-bottom: 0.15rem;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .msg-actions {
    display: none;
    position: absolute;
    top: -0.4rem;
    right: 0.2rem;
    gap: 0.1rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 0.1rem;
  }
  .msg-line-wrap:hover .msg-actions { display: flex; }
  .msg-action-btn {
    background: none;
    border: none;
    font-size: 0.85rem;
    padding: 0.15rem 0.35rem;
    border-radius: 0.4rem;
    width: auto;
    height: auto;
  }
  .msg-action-btn:hover { background: var(--input-bg); }
  .reactions-row { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.2rem; }
  .reaction-pill {
    font-size: 0.78rem;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.05rem 0.4rem;
  }
  .reply-preview {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    background: var(--input-bg);
    border-left: 3px solid var(--accent-strong);
    border-radius: 0.4rem;
    padding: 0.3rem 0.5rem;
    margin-bottom: 0.5rem;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .reply-preview span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #cancelReplyBtn {
    background: none;
    border: none;
    color: var(--muted);
    padding: 0;
    width: auto;
    height: auto;
    flex-shrink: 0;
  }
  .react-menu {
    display: none;
    gap: 0.15rem;
    position: fixed;
    z-index: 30;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 0.6rem;
    box-shadow: 0 4px 18px var(--shadow);
    padding: 0.3rem;
  }
  .react-menu button {
    background: none;
    border: none;
    font-size: 1.2rem;
    padding: 0.15rem 0.3rem;
    border-radius: 0.4rem;
    width: auto;
    height: auto;
  }
  .react-menu button:hover { background: var(--input-bg); }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .modal-card {
    background: var(--card-bg);
    border-radius: 1rem;
    box-shadow: 0 4px 18px var(--shadow);
    padding: 1.5rem;
    width: 320px;
    max-width: 90vw;
  }
  .modal-card h2 { margin: 0 0 1rem; color: var(--accent-strong); font-size: 1.1rem; }
  .modal-card input[type=text] { margin-bottom: 1rem; }
  .avatar-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 0.4rem;
    margin-bottom: 1rem;
  }
  .avatar-opt {
    background: var(--input-bg);
    border: 2px solid var(--border);
    border-radius: 0.6rem;
    font-size: 1.3rem;
    padding: 0.4rem 0;
    cursor: pointer;
  }
  .avatar-opt.selected { border-color: var(--accent-strong); background: var(--accent-strong); }
  .member-row { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0; }
  .member-row span { color: var(--text); font-size: 0.95rem; }

  /* theater mode: video + chat side by side, everything else dropped */
  .theater:fullscreen, .theater:-webkit-full-screen {
    background: #000;
    padding: 0;
    gap: 0;
    height: 100vh;
    flex-wrap: nowrap;
  }
  .theater:fullscreen .video-wrap, .theater:-webkit-full-screen .video-wrap {
    flex: 1 1 auto;
    height: 100vh;
    min-width: 0;
  }
  .theater:fullscreen .video-wrap video, .theater:-webkit-full-screen .video-wrap video {
    border-radius: 0;
  }
  .theater:fullscreen .chat-col, .theater:-webkit-full-screen .chat-col {
    flex: 0 0 300px;
    height: 100vh;
    border-radius: 0;
    box-shadow: none;
  }
  /* keep the dino clear of the 300px chat column while it's actually visible — only
     the endpoint variable changes here, never the animation name, so toggling chat
     visibility doesn't reset the animation to frame 0 mid-flight */
  .theater:fullscreen .dino, .theater:-webkit-full-screen .dino {
    --dino-right-limit: calc(100vw - 300px - 52px);
  }
  #theater.chat-hidden .dino {
    --dino-right-limit: calc(100vw - 52px);
  }
</style>
</head>
<body>
<header>
  <div class="header-right">
    <button id="dinoBtn" title="toggle running dino">🦖</button>
    <button id="membersBtn" title="who's here">👥</button>
    <button id="avatarBtn" title="change name/avatar"></button>
    <button id="themeBtn">light mode</button>
  </div>
</header>
<div class="dino" aria-hidden="true">
  <div class="tail"></div>
  <div class="body"></div>
  <div class="neck"></div>
  <div class="head"></div>
  <div class="jaw"></div>
  <div class="eye"></div>
  <div class="arm"></div>
  <div class="leg1"></div>
  <div class="leg2"></div>
</div>
<div class="modal-overlay" id="profileModal">
  <div class="modal-card">
    <h2>your name &amp; avatar</h2>
    <input type="text" id="nameInput" placeholder="your name" maxlength="20">
    <div class="avatar-grid" id="avatarGrid"></div>
    <button id="saveProfileBtn">save</button>
  </div>
</div>
<div class="modal-overlay" id="membersModal">
  <div class="modal-card">
    <h2>who's here</h2>
    <div id="membersList"></div>
  </div>
</div>
<div class="wrap">
  <div class="main-col">
    <h1>watch party</h1>
    <div class="card">
      <div class="row">
        <input type="text" id="urlInput" placeholder="paste an .mp4 URL">
        <button id="loadBtn">load</button>
      </div>
      <div id="shareBox" class="row">
        <input type="text" id="shareLink" readonly>
        <button id="copyBtn">copy link</button>
      </div>
      <div class="row" style="margin-bottom:0;">
        <button id="theaterBtn">🎬 theater mode</button>
      </div>
      <div id="status">starting…</div>
    </div>
  </div>
</div>
<div class="theater" id="theater">
  <div class="video-wrap" id="videoWrap">
    <video id="video" controls></video>
    <div class="chat-peek-zone" id="chatPeekZone">
      <button id="showChatBtn" class="show-chat-btn" type="button">💬 show chat</button>
    </div>
  </div>
  <div class="chat-col">
    <div class="chat-toolbar" id="chatToolbar">
      <button id="hideChatBtn" type="button" title="hide chat">✕ hide chat</button>
      <button id="theaterMembersBtn" type="button" title="who's here">👥</button>
      <button id="theaterProfileBtn" type="button" title="edit profile">✏️</button>
      <button id="theaterDinoBtn" type="button" title="toggle running dino">🦖</button>
    </div>
    <div id="chatLog"></div>
    <div class="typing-indicator" id="typingIndicator"></div>
    <div class="emoji-picker-wrap" id="emojiPickerWrap">
      <emoji-picker></emoji-picker>
      <button id="heartToggleBtn" type="button" title="send a heart">💜</button>
      <div class="heart-dropdown" id="heartDropdown"></div>
    </div>
    <div class="gif-picker" id="gifPicker">
      <input type="text" id="gifSearch" placeholder="search GIFs…">
      <div class="gif-results" id="gifResults"></div>
    </div>
    <div class="quick-emoji-row" id="quickEmojiRow"></div>
    <div class="reply-preview" id="replyPreview">
      <span id="replyPreviewText"></span>
      <button type="button" id="cancelReplyBtn">✕</button>
    </div>
    <div class="chat-input-bar">
      <input type="text" id="chatInput" placeholder="Type a message…">
      <button id="emojiBtn" type="button" title="emoji">💜</button>
      <button id="gifBtn" type="button" title="GIF">GIF</button>
    </div>
  </div>
  <div class="react-menu" id="reactMenu"></div>
</div>

<script>
// ponytail: sync is event-driven (play/pause/seek), no periodic drift correction.
// Good enough for a casual watch party; add a heartbeat re-sync if drift becomes annoying.

const video = document.getElementById('video');
const urlInput = document.getElementById('urlInput');
const loadBtn = document.getElementById('loadBtn');
const statusEl = document.getElementById('status');
const shareBox = document.getElementById('shareBox');
const shareLink = document.getElementById('shareLink');
const copyBtn = document.getElementById('copyBtn');
const chatLog = document.getElementById('chatLog');
const chatInput = document.getElementById('chatInput');
const emojiBtn = document.getElementById('emojiBtn');
const emojiPicker = document.querySelector('emoji-picker');
const emojiPickerWrap = document.getElementById('emojiPickerWrap');
const heartToggleBtn = document.getElementById('heartToggleBtn');
const heartDropdown = document.getElementById('heartDropdown');
const gifBtn = document.getElementById('gifBtn');
const gifPicker = document.getElementById('gifPicker');
const gifSearch = document.getElementById('gifSearch');
const gifResults = document.getElementById('gifResults');
const themeBtn = document.getElementById('themeBtn');
const theater = document.getElementById('theater');
const theaterBtn = document.getElementById('theaterBtn');
const avatarBtn = document.getElementById('avatarBtn');
const profileModal = document.getElementById('profileModal');
const nameInput = document.getElementById('nameInput');

// elements outside #theater don't render at all while it's fullscreen — the
// Fullscreen API only paints the fullscreen element's own subtree — so anything
// that needs to stay reachable in theater mode gets physically moved in and back out.
function makeFullscreenPortal(el) {
  const homeParent = el.parentNode;
  const homeNext = el.nextSibling;
  return {
    toTheater: () => theater.appendChild(el),
    toHome: () => homeParent.insertBefore(el, homeNext)
  };
}
const fullscreenPortals = [makeFullscreenPortal(dino), makeFullscreenPortal(profileModal), makeFullscreenPortal(membersModal)];

document.addEventListener('fullscreenchange', () => {
  theaterBtn.textContent = document.fullscreenElement ? 'exit theater mode' : '🎬 theater mode';
  if (document.fullscreenElement) {
    fullscreenPortals.forEach(p => p.toTheater());
  } else {
    fullscreenPortals.forEach(p => p.toHome());
    theater.classList.remove('chat-hidden');
  }
});

function toggleReaction(id, emoji) {
  applyReaction(id, emoji, myName);
  relay({ type: 'reaction', targetId: id, emoji, name: myName });
}

function applyReaction(id, emoji, name) {
  if (!reactions[id]) reactions[id] = {};
  let hadThis = false;
  for (const em in reactions[id]) {
    const set = reactions[id][em];
    if (set.has(name)) {
      if (em === emoji) hadThis = true;
      set.delete(name);
      if (!set.size) delete reactions[id][em];
    }
  }
  if (!hadThis) {
    if (!reactions[id][emoji]) reactions[id][emoji] = new Set();
    reactions[id][emoji].add(name);
  }
  renderReactions(id);
}

function renderReactions(id) {
  const entry = msgEls[id];
  if (!entry) return;
  entry.reactionsRow.innerHTML = '';
  const byEmoji = reactions[id] || {};
  Object.keys(byEmoji).forEach(emoji => {
    const set = byEmoji[emoji];
    if (!set.size) return;
    const pill = document.createElement('span');
    pill.className = 'reaction-pill';
    pill.textContent = emoji + ' ' + set.size;
    pill.title = Array.from(set).join(', ');
    entry.reactionsRow.appendChild(pill);
  });
}

function serializeReactions() {
  const out = {};
  for (const id in reactions) {
    out[id] = {};
    for (const emoji in reactions[id]) out[id][emoji] = Array.from(reactions[id][emoji]);
  }
  return out;
}

function setStatus(s) { statusEl.textContent = s; }

function colorFor(name) {
  let h = 0;
  for (let i = 0; i < (name || '').length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
  return 'hsl(' + h + ', 55%, 55%)';
}

let lastMsgName = null;
let lastGroupBody = null;

const EMOJI_ONLY_RE = /^(\p{Extended_Pictographic}|\p{Emoji_Modifier}|‍|️|\s)+$/u;

function renderChat(msg) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-line-wrap';

  if (msg.replyTo) {
    const quote = document.createElement('div');
    quote.className = 'reply-quote';
    quote.textContent = msg.replyTo.name + ': ' + msg.replyTo.snippet;
    wrap.appendChild(quote);
  }

  const line = document.createElement('div');
  line.className = 'line' + (msg.type === 'system' ? ' system-line' : '');
  if (msg.gif) {
    const img = document.createElement('img');
    img.className = 'gif-msg';
    img.src = msg.gif;
    line.appendChild(img);
  } else {
    line.textContent = msg.text;
    if (EMOJI_ONLY_RE.test(msg.text)) line.classList.add('emoji-line');
  }
  wrap.appendChild(line);

  if (msg.id) {
    const actions = document.createElement('div');
    actions.className = 'msg-actions';
    const replyBtn = document.createElement('button');
    replyBtn.type = 'button';
    replyBtn.className = 'msg-action-btn';
    replyBtn.textContent = '↩';
    replyBtn.title = 'reply';
    replyBtn.onclick = () => setReplyingTo({ id: msg.id, name: msg.name, snippet: msg.gif ? '📷 GIF' : msg.text });
    actions.appendChild(replyBtn);
    const reactBtn = document.createElement('button');
    reactBtn.type = 'button';
    reactBtn.className = 'msg-action-btn';
    reactBtn.textContent = '☺+';
    reactBtn.title = 'react';
    reactBtn.onclick = e => { e.stopPropagation(); openReactMenu(msg.id, reactBtn); };
    actions.appendChild(reactBtn);
    wrap.appendChild(actions);

    const reactionsRow = document.createElement('div');
    reactionsRow.className = 'reactions-row';
    wrap.appendChild(reactionsRow);
    msgEls[msg.id] = { wrap, reactionsRow };
  }

  if (msg.name && msg.name === lastMsgName && lastGroupBody) {
    lastGroupBody.appendChild(wrap);
  } else {
    const row = document.createElement('div');
    row.className = 'msg';
    const av = document.createElement('div');
    av.className = 'avatar-bubble';
    av.textContent = msg.avatar || '💬';
    av.style.background = colorFor(msg.name);
    row.appendChild(av);
    const body = document.createElement('div');
    body.className = 'msg-body';
    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = msg.name || '';
    body.appendChild(nameEl);
    body.appendChild(wrap);
    row.appendChild(body);
    chatLog.appendChild(row);
    lastGroupBody = body;
  }
  lastMsgName = msg.name;
  chatLog.scrollTop = chatLog.scrollHeight;

  if (msg.id && reactions[msg.id]) renderReactions(msg.id);
}

function relay(msg) {
  if (isHost) conns.forEach(c => c.send(msg));
  else if (hostConn) hostConn.send(msg);
}

const typingUsers = {}; // name -> expiry timeout id

function renderTypingIndicator() {
  const names = Object.keys(typingUsers);
  if (!names.length) {
    typingIndicator.style.display = 'none';
    return;
  }
  typingIndicator.textContent = (names.length === 1 ? names[0] + ' is typing…' : names.join(', ') + ' are typing…');
  typingIndicator.style.display = 'block';
}

function showTyping(name) {
  if (typingUsers[name]) clearTimeout(typingUsers[name]);
  typingUsers[name] = setTimeout(() => {
    delete typingUsers[name];
    renderTypingIndicator();
  }, 3000);
  renderTypingIndicator();
}

// ponytail: throttled to ~1 ping per 2s of continuous typing, not per keystroke —
// keeps this cheap on the TURN relay quota instead of flooding it.
let typingThrottled = false;
chatInput.addEventListener('input', () => {
  if (typingThrottled) return;
  typingThrottled = true;
  relay({ type: 'typing', name: myName });
  setTimeout(() => { typingThrottled = false; }, 2000);
});

function addSystem(name, avatar, text) {
  const msg = { type: 'system', name, avatar, text };
  chatHistory.push(msg);
  renderChat(msg);
}

function broadcastSystem(name, avatar, text) {
  addSystem(name, avatar, text);
  if (isHost) conns.forEach(c => c.send({ type: 'system', name, avatar, text }));
}

function handleIncoming(msg, fromConn) {
  if (msg.type === 'chat' || msg.type === 'system') {
    if (msg.name && typingUsers[msg.name]) {
      clearTimeout(typingUsers[msg.name]);
      delete typingUsers[msg.name];
      renderTypingIndicator();
    }
    chatHistory.push(msg);
    renderChat(msg);
  } else if (msg.type === 'join') {
    if (fromConn) { fromConn._name = msg.name; fromConn._avatar = msg.avatar; }
    addSystem(msg.name, msg.avatar, 'joined the party 🎉');
    broadcastMembers();
  } else if (msg.type === 'members') {
    members = msg.list;
    renderMembersIfOpen();
  } else if (msg.type === 'sync') {
    if (msg.name) {
      if (msg.action === 'seek') addSystem(msg.name, msg.avatar, 'jumped to ' + formatTime(msg.time));
      else addSystem(msg.name, msg.avatar, msg.action === 'play' ? 'started playing the video' : 'paused the video');
    }
    applyingRemote = true;
    if (Math.abs(video.currentTime - msg.time) > 0.6) video.currentTime = msg.time;
    if (msg.action === 'play') video.play(); else if (msg.action === 'pause') video.pause();
    setTimeout(() => { applyingRemote = false; }, 300);
  } else if (msg.type === 'load') {
    if (video.src !== msg.url) { video.src = msg.url; video.load(); }
    if (msg.name) addSystem(msg.name, msg.avatar, 'loaded a new video');
  } else if (msg.type === 'reaction') {
    applyReaction(msg.targetId, msg.emoji, msg.name);
  } else if (msg.type === 'typing') {
    showTyping(msg.name);
  } else if (msg.type === 'state') {
    if (msg.url) { video.src = msg.url; video.currentTime = msg.time; if (!msg.paused) video.play(); }
    chatHistory = msg.chat || [];
    chatLog.innerHTML = '';
    lastMsgName = null;
    lastGroupBody = null;
    for (const k in msgEls) delete msgEls[k];
    for (const k in reactions) delete reactions[k];
    chatHistory.forEach(renderChat);
    const incoming = msg.reactions || {};
    Object.keys(incoming).forEach(id => {
      reactions[id] = {};
      Object.keys(incoming[id]).forEach(emoji => { reactions[id][emoji] = new Set(incoming[id][emoji]); });
      renderReactions(id);
    });
  }
  if (isHost && fromConn) conns.forEach(c => { if (c !== fromConn) c.send(msg); });
}

function formatTime(s) {
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const mm = String(m).padStart(2, '0'), ss = String(sec).padStart(2, '0');
  return h > 0 ? h + ':' + mm + ':' + ss : m + ':' + ss;
}

// ponytail: dragging the native seek bar makes the browser pause *before* 'seeking'
// fires, then resume after 'seeked' — both are scrub artifacts, not real user actions.
// The trailing resume is caught by a cooldown; the leading pause is caught by delaying
// its report briefly so a following 'seeking' can cancel it. Not foolproof across every
// browser, but covers common Chrome/Safari scrub behavior.
let seekCooldown = false;
let pendingPause = null;
video.addEventListener('seeking', () => {
  seekCooldown = true;
  if (pendingPause) { clearTimeout(pendingPause); pendingPause = null; }
});
video.addEventListener('seeked', () => {
  if (!applyingRemote) {
    addSystem(myName, myAvatar, 'jumped to ' + formatTime(video.currentTime));
    relay({ type: 'sync', action: 'seek', time: video.currentTime, name: myName, avatar: myAvatar });
  }
  setTimeout(() => { seekCooldown = false; }, 400);
});
video.addEventListener('pause', () => {
  if (applyingRemote || seekCooldown) return;
  pendingPause = setTimeout(() => {
    pendingPause = null;
    addSystem(myName, myAvatar, 'paused the video');
    relay({ type: 'sync', action: 'pause', time: video.currentTime, name: myName, avatar: myAvatar });
  }, 150);
});
video.addEventListener('play', () => {
  if (applyingRemote || seekCooldown) return;
  addSystem(myName, myAvatar, 'started playing the video');
  relay({ type: 'sync', action: 'play', time: video.currentTime, name: myName, avatar: myAvatar });
});
video.addEventListener('error', () => setStatus('could not load that video — check the URL allows direct/hotlink playback'));

// ponytail: STUN-only NAT traversal fails silently (no error, just hangs) whenever
// either side is behind a restrictive/symmetric NAT — mobile data, school/office wifi,
// some routers. A TURN relay fixes that. Get a free app + API key at metered.ca

const METERED_APP_NAME = 'ayushg12';
const METERED_API_KEY = 'a4b39c6df1c790ae25b7f0a74e893b912b54';
const FALLBACK_ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' }
];

async function getIceServers() {
  try {
    const res = await fetch('https://' + METERED_APP_NAME + '.metered.live/api/v1/turn/credentials?apiKey=' + METERED_API_KEY);
    if (!res.ok) throw new Error('bad response');
    const iceServers = await res.json();
    if (!Array.isArray(iceServers) || !iceServers.length) throw new Error('empty response');
    return iceServers;
  } catch (e) {
    return FALLBACK_ICE_SERVERS;
  }
}

getIceServers().then(iceServers => {
  peer = new Peer(isHost ? roomId : undefined, { config: { iceServers } });

  peer.on('open', () => {
    if (isHost) {
      shareLink.value = location.href;
      shareBox.style.display = 'flex';
      setStatus('room open — share the link above. waiting for others…');
    } else {
      setStatus('connecting to host…');
      const stuckTimer = setTimeout(() => {
        setStatus('still connecting — this can take longer on some networks. make sure the host\'s tab is still open.');
      }, 12000);
      hostConn = peer.connect(roomId);
      hostConn.on('open', () => {
        clearTimeout(stuckTimer);
        setStatus('connected');
        hostConn.send({ type: 'join', name: myName, avatar: myAvatar });
        addSystem(myName, myAvatar, 'joined the party 🎉');
      });
      hostConn.on('data', msg => handleIncoming(msg));
      hostConn.on('close', () => setStatus('lost connection to host'));
    }
  });

  peer.on('connection', conn => {
    conns.push(conn);
    conn.on('open', () => {
      conn.send({ type: 'state', url: video.src || null, time: video.currentTime, paused: video.paused, chat: chatHistory, reactions: serializeReactions() });
      setStatus(conns.length + ' other viewer(s) connected');
    });
    conn.on('data', msg => handleIncoming(msg, conn));
    conn.on('close', () => {
      const i = conns.indexOf(conn);
      if (i > -1) conns.splice(i, 1);
      setStatus(conns.length + ' other viewer(s) connected');
      broadcastSystem(conn._name || 'someone', conn._avatar || '💬', 'left');
      broadcastMembers();
    });
  });

  peer.on('error', err => {
    if (!isHost && err.type === 'peer-unavailable') setStatus('room not found — the host may be offline');
    else setStatus('connection error: ' + err.type);
  });
});

copyBtn.onclick = () => {
  navigator.clipboard.writeText(shareLink.value);
  copyBtn.textContent = 'copied!';
  setTimeout(() => copyBtn.textContent = 'copy link', 1200);
};
</script>
</body>
